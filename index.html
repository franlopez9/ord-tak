<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pupusería POS - Liquid Glass Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 15% 15%, #e0e7ff 0%, transparent 45%),
                  radial-gradient(circle at 85% 25%, #fae8ff 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, #dcfce7 0%, transparent 50%),
                  #f3f4f6;
      background-attachment: fixed;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .liquid-glass-solid {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .liquid-glass-dark {
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .liquid-pill {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body class="text-neutral-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MENU_INICIAL = [
      { id: 'revuelta', nombre: 'Revueltas', emoji: '🫓', precioMaiz: 1.00, precioArroz: 1.25, esPupusa: true, activo: true },
      { id: 'queso', nombre: 'Queso', emoji: '🧀', precioMaiz: 1.25, precioArroz: 1.50, esPupusa: true, activo: true },
      { id: 'frijol_queso', nombre: 'Frijol con Queso', emoji: '🫘', precioMaiz: 1.00, precioArroz: 1.25, esPupusa: true, activo: true },
      { id: 'chicharron', nombre: 'Chicharrón', emoji: '🥓', precioMaiz: 1.25, precioArroz: 1.50, esPupusa: true, activo: true },
      { id: 'loroco', nombre: 'Queso con Loroco', emoji: '🌿', precioMaiz: 1.25, precioArroz: 1.50, esPupusa: true, activo: true },
      { id: 'ayote', nombre: 'Ayote / Jalapeño', emoji: '🌶️', precioMaiz: 1.25, precioArroz: 1.50, esPupusa: true, activo: true },
      { id: 'loca', nombre: 'Pupusa Loca', emoji: '⭐', precioMaiz: 2.25, precioArroz: 2.75, esPupusa: true, activo: true },
      { id: 'soda', nombre: 'Gaseosa / Soda', emoji: '🥤', precio: 1.00, esPupusa: false, activo: true },
      { id: 'fresco', nombre: 'Fresco Natural', emoji: '🍹', precio: 0.75, esPupusa: false, activo: true },
      { id: 'cafe', nombre: 'Café de Olla', emoji: '☕', precio: 0.60, esPupusa: false, activo: true },
    ];

    const GASTOS_CATEGORIAS = [
      { id: 'quesillo', label: 'Quesillo', icon: '🧀', color: 'bg-amber-500' },
      { id: 'masa', label: 'Masa / Harina', icon: '🌽', color: 'bg-yellow-500' },
      { id: 'carnes_frijol', label: 'Chicharrón / Frijol', icon: '🥓', color: 'bg-red-500' },
      { id: 'verduras', label: 'Verduras / Curtido', icon: '🥬', color: 'bg-emerald-500' },
      { id: 'gas', label: 'Gas / Carbón', icon: '🔥', color: 'bg-orange-500' },
      { id: 'luz_agua', label: 'Luz y Agua', icon: '💡', color: 'bg-cyan-500' },
      { id: 'alquiler', label: 'Alquiler / Puesto', icon: '🏠', color: 'bg-indigo-500' },
      { id: 'desechables', label: 'Bolsas y Plásticos', icon: '🛍️', color: 'bg-sky-500' },
      { id: 'personal', label: 'Sueldo / Retiro', icon: '👤', color: 'bg-rose-500' },
    ];

    function App() {
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('pupuseria_config_v1');
          return saved ? JSON.parse(saved) : null;
        } catch { return null; }
      });

      const [editandoConfig, setEditandoConfig] = useState(false);
      const [pasoOnboarding, setPasoOnboarding] = useState(1);
      const [formConfig, setFormConfig] = useState(() => config || {
        dueno: '',
        negocio: '',
        whatsapp: '',
        horario: '4:30 PM - 10:00 PM',
        trabajadores: 2,
        cantidadMesas: 6,
        haceDelivery: true,
        fondoInicial: 15.00,
        metaDiaria: 100.00,
        logo: '',
        bancoNombre: 'Banco Agrícola',
        bancoCuenta: '',
        bancoQr: '',
        menu: MENU_INICIAL
      });

      const [nuevoCliNombre, setNuevoCliNombre] = useState('');
      const [nuevoCliTel, setNuevoCliTel] = useState('');
      const [nuevoCliFiado, setNuevoCliFiado] = useState('');

      const [vista, setVista] = useState('pos');
      const [periodoResumen, setPeriodoResumen] = useState('hoy');

      const [modalServicio, setModalServicio] = useState(false);
      const [modalComanda, setModalComanda] = useState(false);
      const [modalCobrarActiva, setModalCobrarActiva] = useState(null);
      const [modalDividir, setModalDividir] = useState(false);
      const [modalVerQr, setModalVerQr] = useState(false);
      const [personasDividir, setPersonasDividir] = useState(2);

      // Servicio actual para nueva orden
      const [tipoServicio, setTipoServicio] = useState('mesa');
      const [mesaSeleccionada, setMesaSeleccionada] = useState(1);
      const [nombreCliente, setNombreCliente] = useState('');
      const [telefonoCliente, setTelefonoCliente] = useState('');
      const [direccionCliente, setDireccionCliente] = useState('');

      // Edición de orden activa existente
      const [ordenActivaEditandoId, setOrdenActivaEditandoId] = useState(null);
      const [ordenActual, setOrdenActual] = useState({});
      const [estadoPagoInicial, setEstadoPagoInicial] = useState('pendiente');
      const [metodoPago, setMetodoPago] = useState('efectivo');

      // Contador correlativo de órdenes
      const [contadorOrden, setContadorOrden] = useState(() => {
        try { return parseInt(localStorage.getItem('pup_contador_orden')) || 1; } catch { return 1; }
      });

      const [ordenesActivas, setOrdenesActivas] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pup_ordenes_activas')) || []; } catch { return []; }
      });

      const [transacciones, setTransacciones] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pup_transacciones')) || []; } catch { return []; }
      });

      const [gastos, setGastos] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pup_gastos')) || []; } catch { return []; }
      });

      const [clientes, setClientes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pup_clientes')) || []; } catch { return []; }
      });

      // Estados para crear / editar gastos
      const [montoGasto, setMontoGasto] = useState('');
      const [catGasto, setCatGasto] = useState(GASTOS_CATEGORIAS[0].id);
      const [gastoEditandoId, setGastoEditandoId] = useState(null);

      useEffect(() => {
        if (config) localStorage.setItem('pupuseria_config_v1', JSON.stringify(config));
      }, [config]);
      useEffect(() => { localStorage.setItem('pup_contador_orden', contadorOrden.toString()); }, [contadorOrden]);
      useEffect(() => { localStorage.setItem('pup_ordenes_activas', JSON.stringify(ordenesActivas)); }, [ordenesActivas]);
      useEffect(() => { localStorage.setItem('pup_transacciones', JSON.stringify(transacciones)); }, [transacciones]);
      useEffect(() => { localStorage.setItem('pup_gastos', JSON.stringify(gastos)); }, [gastos]);
      useEffect(() => { localStorage.setItem('pup_clientes', JSON.stringify(clientes)); }, [clientes]);

      const manejarSubidaImagen = (e, campo) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => setFormConfig(prev => ({ ...prev, [campo]: reader.result }));
        reader.readAsDataURL(file);
      };

      const agregarClienteInicial = () => {
        if (!nuevoCliNombre.trim()) return;
        const deudaInicial = parseFloat(nuevoCliFiado) || 0;
        const nuevo = {
          id: Date.now(),
          nombre: nuevoCliNombre.trim(),
          telefono: nuevoCliTel.trim(),
          direccion: '',
          comprasCount: deudaInicial > 0 ? 1 : 0,
          saldoFiado: deudaInicial,
          historialFiados: deudaInicial > 0 ? [{ fecha: new Date().toLocaleDateString('es-SV'), hora: 'Inicial', monto: deudaInicial, detalle: 'Saldo inicial cargado' }] : []
        };
        setClientes(prev => [nuevo, ...prev]);
        setNuevoCliNombre('');
        setNuevoCliTel('');
        setNuevoCliFiado('');
      };

      const guardarConfiguracion = () => {
        const finalConfig = {
          ...formConfig,
          negocio: formConfig.negocio.trim() || 'Mi Pupusería',
          dueno: formConfig.dueno.trim() || 'Propietario'
        };
        setConfig(finalConfig);
        setEditandoConfig(false);
        setPasoOnboarding(1);
      };

      const abrirConfiguracion = () => {
        setFormConfig(config);
        setPasoOnboarding(1);
        setEditandoConfig(true);
      };

      // ======================== PANTALLA ONBOARDING ========================
      if (!config || editandoConfig) {
        return (
          <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-4 pt-2">
                <div>
                  <p className="text-[10px] font-bold uppercase tracking-widest text-neutral-500">
                    {editandoConfig ? 'Ajustes del Negocio' : 'Configuración Inicial'}
                  </p>
                  <h1 className="text-xl font-black text-neutral-900">Paso {pasoOnboarding} de 4</h1>
                </div>
                {editandoConfig && (
                  <button onClick={() => setEditandoConfig(false)} className="liquid-pill px-3 py-1.5 rounded-full text-xs font-bold">
                    Cerrar ✕
                  </button>
                )}
              </div>

              <div className="grid grid-cols-4 gap-1.5 mb-5">
                {[1,2,3,4].map(step => (
                  <div key={step} className={`h-1.5 rounded-full transition-all ${step <= pasoOnboarding ? 'bg-neutral-900' : 'bg-white/60'}`} />
                ))}
              </div>

              {pasoOnboarding === 1 && (
                <div className="liquid-glass rounded-3xl p-5 space-y-4">
                  <h2 className="font-bold text-base text-neutral-900">1. Datos de tu Pupusería</h2>
                  <div className="flex items-center gap-4">
                    <label className="w-16 h-16 rounded-2xl bg-white/80 border border-dashed border-neutral-400 flex flex-col items-center justify-center cursor-pointer overflow-hidden shrink-0">
                      {formConfig.logo ? (
                        <img src={formConfig.logo} alt="Logo" className="w-full h-full object-cover" />
                      ) : (
                        <>
                          <span className="text-xl">📸</span>
                          <span className="text-[9px] font-bold text-neutral-500">Logo</span>
                        </>
                      )}
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => manejarSubidaImagen(e, 'logo')} />
                    </label>
                    <div className="text-xs text-neutral-600">
                      <p className="font-bold text-neutral-900">Logo del negocio (Opcional)</p>
                      <p className="text-[11px]">Toca el cuadro para subir una foto desde tu galería.</p>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-500 uppercase">Nombre de la Pupusería *</label>
                    <input type="text" placeholder="Ej. Pupusería Doña Carmen" value={formConfig.negocio} onChange={e => setFormConfig({...formConfig, negocio: e.target.value})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-semibold focus:outline-none" />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-neutral-500 uppercase">Tu Nombre (Encargado/Dueño)</label>
                    <input type="text" placeholder="Ej. Carmen Hernández" value={formConfig.dueno} onChange={e => setFormConfig({...formConfig, dueno: e.target.value})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-semibold focus:outline-none" />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">WhatsApp Negocio</label>
                      <input type="tel" placeholder="7890-1234" value={formConfig.whatsapp} onChange={e => setFormConfig({...formConfig, whatsapp: e.target.value})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-semibold focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">Horario Servicio</label>
                      <input type="text" placeholder="5:00 PM - 10:00 PM" value={formConfig.horario} onChange={e => setFormConfig({...formConfig, horario: e.target.value})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-semibold focus:outline-none" />
                    </div>
                  </div>
                </div>
              )}

              {pasoOnboarding === 2 && (
                <div className="liquid-glass rounded-3xl p-5 space-y-4">
                  <h2 className="font-bold text-base text-neutral-900">2. Operación, Caja y Banco</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">Cantidad de Mesas</label>
                      <input type="number" min="0" max="30" value={formConfig.cantidadMesas} onChange={e => setFormConfig({...formConfig, cantidadMesas: parseInt(e.target.value) || 0})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-mono font-bold focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">Trabajadores</label>
                      <input type="number" min="1" max="20" value={formConfig.trabajadores} onChange={e => setFormConfig({...formConfig, trabajadores: parseInt(e.target.value) || 1})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-mono font-bold focus:outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">Fondo Caja Inicial ($)</label>
                      <input type="number" step="0.01" placeholder="15.00" value={formConfig.fondoInicial} onChange={e => setFormConfig({...formConfig, fondoInicial: parseFloat(e.target.value) || 0})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-mono font-bold focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-neutral-500 uppercase">Meta Venta Diaria ($)</label>
                      <input type="number" step="1" placeholder="100.00" value={formConfig.metaDiaria} onChange={e => setFormConfig({...formConfig, metaDiaria: parseFloat(e.target.value) || 0})} className="w-full mt-1 bg-white/80 border border-white rounded-2xl p-3 text-sm font-mono font-bold focus:outline-none" />
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-white/60 p-3 rounded-2xl">
                    <span className="text-xs font-bold text-neutral-800">🛵 ¿Hacen servicio a domicilio (Delivery)?</span>
                    <button onClick={() => setFormConfig({...formConfig, haceDelivery: !formConfig.haceDelivery})} className={`px-3 py-1 rounded-full text-xs font-bold transition ${formConfig.haceDelivery ? 'bg-emerald-500 text-white' : 'bg-neutral-300 text-neutral-700'}`}>
                      {formConfig.haceDelivery ? 'Sí' : 'No'}
                    </button>
                  </div>

                  <div className="pt-2 border-t border-white/60 space-y-2.5">
                    <p className="text-xs font-bold text-neutral-900">🏦 Datos para Transferencia y QR</p>
                    <div className="grid grid-cols-2 gap-2">
                      <select value={formConfig.bancoNombre} onChange={e => setFormConfig({...formConfig, bancoNombre: e.target.value})} className="bg-white/80 border border-white rounded-2xl p-2.5 text-xs font-bold focus:outline-none">
                        <option value="Banco Agrícola">Banco Agrícola</option>
                        <option value="BAC Credomatic">BAC Credomatic</option>
                        <option value="Banco Cuscatlán">Banco Cuscatlán</option>
                        <option value="Davivienda">Davivienda</option>
                        <option value="Chivo / Otro">Otro / Transfer365</option>
                      </select>
                      <input type="text" placeholder="# de Cuenta" value={formConfig.bancoCuenta} onChange={e => setFormConfig({...formConfig, bancoCuenta: e.target.value})} className="bg-white/80 border border-white rounded-2xl p-2.5 text-xs font-mono font-semibold focus:outline-none" />
                    </div>

                    <label className="flex items-center justify-center gap-3 p-3 rounded-2xl bg-white/70 border border-dashed border-neutral-400 cursor-pointer">
                      {formConfig.bancoQr ? (
                        <div className="flex items-center gap-3">
                          <img src={formConfig.bancoQr} alt="QR" className="w-12 h-12 rounded-xl object-cover" />
                          <span className="text-xs font-bold text-emerald-700">✓ QR cargado (Toca para cambiar)</span>
                        </div>
                      ) : (
                        <span className="text-xs font-bold text-neutral-700">📲 Subir captura de tu QR Bancario</span>
                      )}
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => manejarSubidaImagen(e, 'bancoQr')} />
                    </label>
                  </div>
                </div>
              )}

              {pasoOnboarding === 3 && (
                <div className="liquid-glass rounded-3xl p-5">
                  <h2 className="font-bold text-base text-neutral-900 mb-1">3. Tu Menú y Precios</h2>
                  <p className="text-xs text-neutral-500 mb-3">Activa lo que vendes y ajusta los precios de Maíz y Arroz.</p>
                  <div className="space-y-2 max-h-[55vh] overflow-y-auto pr-1">
                    {formConfig.menu.map((item, idx) => (
                      <div key={item.id} className={`p-3 rounded-2xl border transition ${item.activo ? 'bg-white/85 border-white' : 'bg-white/30 border-transparent opacity-60'}`}>
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <span className="text-lg">{item.emoji}</span>
                            <span className="font-bold text-xs text-neutral-900">{item.nombre}</span>
                          </div>
                          <button
                            onClick={() => {
                              const copia = [...formConfig.menu];
                              copia[idx].activo = !copia[idx].activo;
                              setFormConfig({...formConfig, menu: copia});
                            }}
                            className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${item.activo ? 'bg-neutral-900 text-white' : 'bg-neutral-300 text-neutral-600'}`}
                          >
                            {item.activo ? 'Activo' : 'Oculto'}
                          </button>
                        </div>

                        {item.activo && (
                          item.esPupusa ? (
                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <div className="flex items-center justify-between bg-neutral-100/80 px-2.5 py-1.5 rounded-xl">
                                <span className="text-[10px] font-bold text-neutral-500">Maíz $</span>
                                <input type="number" step="0.05" value={item.precioMaiz} onChange={e => { const copia = [...formConfig.menu]; copia[idx].precioMaiz = parseFloat(e.target.value) || 0; setFormConfig({...formConfig, menu: copia}); }} className="w-14 text-right font-mono font-bold bg-transparent focus:outline-none" />
                              </div>
                              <div className="flex items-center justify-between bg-neutral-100/80 px-2.5 py-1.5 rounded-xl">
                                <span className="text-[10px] font-bold text-neutral-500">Arroz $</span>
                                <input type="number" step="0.05" value={item.precioArroz} onChange={e => { const copia = [...formConfig.menu]; copia[idx].precioArroz = parseFloat(e.target.value) || 0; setFormConfig({...formConfig, menu: copia}); }} className="w-14 text-right font-mono font-bold bg-transparent focus:outline-none" />
                              </div>
                            </div>
                          ) : (
                            <div className="flex items-center justify-between bg-neutral-100/80 px-2.5 py-1.5 rounded-xl text-xs">
                              <span className="text-[10px] font-bold text-neutral-500">Precio Unitario $</span>
                              <input type="number" step="0.05" value={item.precio} onChange={e => { const copia = [...formConfig.menu]; copia[idx].precio = parseFloat(e.target.value) || 0; setFormConfig({...formConfig, menu: copia}); }} className="w-16 text-right font-mono font-bold bg-transparent focus:outline-none" />
                            </div>
                          )
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {pasoOnboarding === 4 && (
                <div className="liquid-glass rounded-3xl p-5 space-y-3">
                  <h2 className="font-bold text-base text-neutral-900">4. Cartera de Clientes (Opcional)</h2>
                  <p className="text-xs text-neutral-600">Agrega tus clientes frecuentes o vecinos que ya tienen saldo fiado pendiente.</p>
                  <div className="space-y-2 bg-white/60 p-3 rounded-2xl">
                    <input type="text" placeholder="Nombre del cliente" value={nuevoCliNombre} onChange={e => setNuevoCliNombre(e.target.value)} className="w-full bg-white rounded-xl p-2.5 text-xs font-semibold focus:outline-none" />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="tel" placeholder="Teléfono (WhatsApp)" value={nuevoCliTel} onChange={e => setNuevoCliTel(e.target.value)} className="bg-white rounded-xl p-2.5 text-xs font-semibold focus:outline-none" />
                      <input type="number" step="0.01" placeholder="Fiado inicial ($0.00)" value={nuevoCliFiado} onChange={e => setNuevoCliFiado(e.target.value)} className="bg-white rounded-xl p-2.5 text-xs font-mono font-semibold focus:outline-none" />
                    </div>
                    <button onClick={agregarClienteInicial} className="w-full py-2 bg-neutral-900 text-white rounded-xl text-xs font-bold">+ Agregar a la lista</button>
                  </div>
                  <div className="max-h-40 overflow-y-auto space-y-1.5">
                    {clientes.map(c => (
                      <div key={c.id} className="flex justify-between items-center bg-white/80 px-3 py-2 rounded-xl text-xs">
                        <div>
                          <p className="font-bold text-neutral-900">{c.nombre}</p>
                          <p className="text-[10px] text-neutral-500">{c.telefono || 'Sin teléfono'}</p>
                        </div>
                        {c.saldoFiado > 0 && (
                          <span className="font-mono font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg">Debe ${c.saldoFiado.toFixed(2)}</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="flex gap-2 mt-4">
              {pasoOnboarding > 1 && (
                <button onClick={() => setPasoOnboarding(pasoOnboarding - 1)} className="flex-1 py-3.5 liquid-glass rounded-2xl font-bold text-xs text-neutral-800">← Atrás</button>
              )}
              {pasoOnboarding < 4 ? (
                <button onClick={() => setPasoOnboarding(pasoOnboarding + 1)} className="flex-1 py-3.5 liquid-glass-dark text-white rounded-2xl font-bold text-xs">Siguiente →</button>
              ) : (
                <button onClick={guardarConfiguracion} className="flex-1 py-3.5 bg-emerald-600 text-white rounded-2xl font-black text-xs shadow-lg">✓ Guardar y Empezar</button>
              )}
            </div>
          </div>
        );
      }

      // ======================== OPERACIÓN POS ========================
      const menuActivo = config.menu.filter(m => m.activo);
      const ordenEditando = ordenActivaEditandoId ? ordenesActivas.find(o => o.id === ordenActivaEditandoId) : null;

      const etiquetaServicioCorto = () => {
        if (tipoServicio === 'mesa') return mesaSeleccionada === 'barra' ? '🍽️ Barra' : `🍽️ Mesa ${mesaSeleccionada}`;
        if (tipoServicio === 'llevar') return '🛍️ Llevar';
        return '🛵 Delivery';
      };

      const formatearNumeroOrden = (num) => `#${String(num).padStart(2, '0')}`;

      const generarResumenTexto = (itemsObj) => {
        return Object.entries(itemsObj).map(([key, cant]) => {
          const [prodId, masa] = key.split('|');
          const prod = menuActivo.find(m => m.id === prodId);
          if (!prod) return '';
          const detalleMasa = prod.esPupusa ? (masa === 'arroz' ? 'Arroz' : 'Maíz') : '';
          return `${cant}x ${prod.nombre}${detalleMasa ? ` (${detalleMasa})` : ''}`;
        }).filter(Boolean).join(', ');
      };

      const ajustarCantidad = (itemKey, cambio) => {
        setOrdenActual(prev => {
          const actual = prev[itemKey] || 0;
          const nuevo = actual + cambio;
          if (nuevo <= 0) {
            const copia = { ...prev };
            delete copia[itemKey];
            return copia;
          }
          return { ...prev, [itemKey]: nuevo };
        });
      };

      const totalOrden = Object.entries(ordenActual).reduce((total, [key, cant]) => {
        const [prodId, masa] = key.split('|');
        const prod = menuActivo.find(m => m.id === prodId);
        if (!prod) return total;
        const precio = prod.esPupusa ? (masa === 'arroz' ? prod.precioArroz : prod.precioMaiz) : prod.precio;
        return total + (precio * cant);
      }, 0);

      const itemsTotalCount = Object.values(ordenActual).reduce((a, b) => a + b, 0);

      useEffect(() => {
        if (modalComanda && itemsTotalCount === 0) {
          setModalComanda(false);
        }
      }, [itemsTotalCount, modalComanda]);

      // ABRIR EDICIÓN DE UNA ORDEN ACTIVA
      const iniciarEdicionOrdenActiva = (orden) => {
        setOrdenActivaEditandoId(orden.id);
        setOrdenActual(orden.itemsMap ? { ...orden.itemsMap } : {});
        setTipoServicio(orden.tipoServicio || 'mesa');
        if (orden.mesaSeleccionada) setMesaSeleccionada(orden.mesaSeleccionada);
        setNombreCliente(orden.clienteNombre || '');
        setTelefonoCliente(orden.clienteTel || '');
        setDireccionCliente(orden.clienteDir || '');
        setVista('pos');
      };

      const cancelarEdicionOrdenActiva = () => {
        setOrdenActivaEditandoId(null);
        setOrdenActual({});
      };

      // GUARDAR CAMBIOS DE UNA ORDEN EDITADA
      const guardarEdicionOrdenActiva = () => {
        if (!ordenEditando || totalOrden <= 0) return;

        const nuevoDetalle = generarResumenTexto(ordenActual);
        let nuevoDestino = '';
        if (tipoServicio === 'mesa') nuevoDestino = mesaSeleccionada === 'barra' ? 'Barra' : `Mesa #${mesaSeleccionada}`;
        else if (tipoServicio === 'llevar') nuevoDestino = `Llevar: ${nombreCliente || 'Mostrador'}`;
        else nuevoDestino = `Delivery: ${nombreCliente || 'Cliente'} (${direccionCliente})`;

        setOrdenesActivas(prev => prev.map(o => {
          if (o.id !== ordenEditando.id) return o;

          const yaPagado = o.montoPagado || 0;
          const diferencia = totalOrden - yaPagado;

          if (yaPagado > 0) {
            return {
              ...o,
              tipoServicio,
              mesaSeleccionada,
              destino: nuevoDestino,
              clienteNombre: nombreCliente.trim(),
              clienteTel: telefonoCliente.trim(),
              clienteDir: direccionCliente.trim(),
              itemsMap: { ...ordenActual },
              detalle: nuevoDetalle,
              monto: totalOrden,
              saldoPendiente: diferencia > 0 ? diferencia : 0,
              pagada: diferencia <= 0
            };
          } else {
            return {
              ...o,
              tipoServicio,
              mesaSeleccionada,
              destino: nuevoDestino,
              clienteNombre: nombreCliente.trim(),
              clienteTel: telefonoCliente.trim(),
              clienteDir: direccionCliente.trim(),
              itemsMap: { ...ordenActual },
              detalle: nuevoDetalle,
              monto: totalOrden,
              saldoPendiente: totalOrden,
              pagada: false
            };
          }
        }));

        setOrdenActual({});
        setOrdenActivaEditandoId(null);
        setVista('activas');
      };

      // ELIMINAR ORDEN ACTIVA POR ERROR
      const eliminarOrdenActiva = (orden) => {
        const msg = orden.montoPagado > 0
          ? `¿Eliminar la Orden ${formatearNumeroOrden(orden.numero)} (${orden.destino})? Se revertirá el cobro de $${orden.montoPagado.toFixed(2)} registrado.`
          : `¿Eliminar la Orden ${formatearNumeroOrden(orden.numero)} (${orden.destino})?`;

        if (!window.confirm(msg)) return;

        if (orden.transaccionId) {
          setTransacciones(prev => prev.filter(t => t.id !== orden.transaccionId));
        }

        setOrdenesActivas(prev => prev.filter(o => o.id !== orden.id));
      };

      const actualizarDirectorioCliente = (nombre, tel, dir, montoCompra, esFiado, detallePedido, fecha, hora) => {
        if (!nombre.trim()) return;
        const nombreNorm = nombre.trim();
        setClientes(prev => {
          const idx = prev.findIndex(c => c.nombre.toLowerCase() === nombreNorm.toLowerCase());
          if (idx >= 0) {
            const copia = [...prev];
            const existente = copia[idx];
            copia[idx] = {
              ...existente,
              telefono: tel.trim() || existente.telefono,
              direccion: dir.trim() || existente.direccion,
              comprasCount: existente.comprasCount + 1,
              saldoFiado: esFiado ? existente.saldoFiado + montoCompra : existente.saldoFiado,
              historialFiados: esFiado
                ? [{ fecha, hora, monto: montoCompra, detalle: detallePedido }, ...existente.historialFiados]
                : existente.historialFiados
            };
            return copia;
          } else {
            return [{
              id: Date.now(),
              nombre: nombreNorm,
              telefono: tel.trim(),
              direccion: dir.trim(),
              comprasCount: 1,
              saldoFiado: esFiado ? montoCompra : 0,
              historialFiados: esFiado ? [{ fecha, hora, monto: montoCompra, detalle: detallePedido }] : []
            }, ...prev];
          }
        });
      };

      const crearOrdenActiva = () => {
        if (totalOrden <= 0) return;
        const ahora = new Date();
        const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const fechaStr = ahora.toLocaleDateString('es-SV');
        const numOrdenActual = contadorOrden;

        let destino = '';
        if (tipoServicio === 'mesa') destino = mesaSeleccionada === 'barra' ? 'Barra' : `Mesa #${mesaSeleccionada}`;
        else if (tipoServicio === 'llevar') destino = `Llevar: ${nombreCliente || 'Mostrador'}`;
        else destino = `Delivery: ${nombreCliente || 'Cliente'} (${direccionCliente})`;

        const itemsTexto = generarResumenTexto(ordenActual);
        const yaPagado = estadoPagoInicial === 'pagado';
        const esFiado = yaPagado && metodoPago === 'fiado';
        let txId = null;

        if (yaPagado) {
          if (esFiado) {
            actualizarDirectorioCliente(nombreCliente || 'Cliente sin nombre', telefonoCliente, direccionCliente, totalOrden, true, itemsTexto, fechaStr, horaStr);
          } else {
            txId = Date.now();
            setTransacciones(prev => [{
              id: txId,
              numeroOrden: numOrdenActual,
              tipoServicio, // 'mesa' | 'llevar' | 'delivery'
              timestamp: ahora.getTime(),
              monto: totalOrden,
              metodo: metodoPago,
              destino,
              detalle: itemsTexto,
              hora: horaStr,
              fecha: fechaStr
            }, ...prev]);
            if (nombreCliente.trim()) {
              actualizarDirectorioCliente(nombreCliente, telefonoCliente, direccionCliente, totalOrden, false, itemsTexto, fechaStr, horaStr);
            }
          }
        }

        const nuevaActiva = {
          id: Date.now() + 1,
          numero: numOrdenActual,
          transaccionId: txId,
          timestamp: ahora.getTime(),
          hora: horaStr,
          fecha: fechaStr,
          tipoServicio,
          mesaSeleccionada,
          destino,
          clienteNombre: nombreCliente.trim(),
          clienteTel: telefonoCliente.trim(),
          clienteDir: direccionCliente.trim(),
          itemsMap: { ...ordenActual },
          detalle: itemsTexto,
          monto: totalOrden,
          montoPagado: yaPagado ? totalOrden : 0,
          saldoPendiente: yaPagado ? 0 : totalOrden,
          pagada: yaPagado,
          metodoPago: yaPagado ? metodoPago : null
        };

        setOrdenesActivas(prev => [nuevaActiva, ...prev]);
        setContadorOrden(prev => prev + 1);
        setOrdenActual({});
        setEstadoPagoInicial('pendiente');
        setModalComanda(false);
        setVista('activas');
      };

      const cobrarOrdenActiva = (orden, metodoElegido) => {
        const ahora = new Date();
        const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const fechaStr = ahora.toLocaleDateString('es-SV');
        const montoACobrar = orden.saldoPendiente > 0 ? orden.saldoPendiente : orden.monto;
        let txId = orden.transaccionId || null;

        if (metodoElegido === 'fiado') {
          actualizarDirectorioCliente(orden.clienteNombre || 'Cliente sin nombre', orden.clienteTel, orden.clienteDir, montoACobrar, true, orden.detalle, fechaStr, horaStr);
        } else {
          txId = Date.now();
          setTransacciones(prev => [{
            id: txId,
            numeroOrden: orden.numero,
            tipoServicio: orden.tipoServicio || 'mesa',
            timestamp: ahora.getTime(),
            monto: montoACobrar,
            metodo: metodoElegido,
            destino: orden.destino,
            detalle: orden.montoPagado > 0 ? `Saldo extra Orden ${formatearNumeroOrden(orden.numero)}: ${orden.detalle}` : orden.detalle,
            hora: horaStr,
            fecha: fechaStr
          }, ...prev]);
          if (orden.clienteNombre) {
            actualizarDirectorioCliente(orden.clienteNombre, orden.clienteTel, orden.clienteDir, montoACobrar, false, orden.detalle, fechaStr, horaStr);
          }
        }

        setOrdenesActivas(prev => prev.map(o => o.id === orden.id ? {
          ...o,
          transaccionId: txId,
          pagada: true,
          montoPagado: o.monto,
          saldoPendiente: 0,
          metodoPago: metodoElegido
        } : o));
        setModalCobrarActiva(null);
      };

      const marcarComoEntregada = (orden) => {
        if (!orden.pagada) {
          setModalCobrarActiva(orden);
          return;
        }
        setOrdenesActivas(prev => prev.filter(o => o.id !== orden.id));
      };

      const saldarDeudaCliente = (clienteId, metodoCobro) => {
        const cli = clientes.find(c => c.id === clienteId);
        if (!cli || cli.saldoFiado <= 0) return;

        const ahora = new Date();
        setTransacciones(prev => [{
          id: Date.now(),
          tipoServicio: 'abono_fiado',
          timestamp: ahora.getTime(),
          monto: cli.saldoFiado,
          metodo: metodoCobro,
          destino: `Abono Fiado: ${cli.nombre}`,
          detalle: `Liquidación de cuenta acumulada`,
          hora: ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          fecha: ahora.toLocaleDateString('es-SV')
        }, ...prev]);

        setClientes(prev => prev.map(c => c.id === clienteId ? { ...c, saldoFiado: 0, historialFiados: [] } : c));
      };

      // CREAR O ACTUALIZAR GASTO
      const guardarGasto = () => {
        const val = parseFloat(montoGasto);
        if (!val || val <= 0) return;
        const cat = GASTOS_CATEGORIAS.find(c => c.id === catGasto);

        if (gastoEditandoId) {
          setGastos(prev => prev.map(g => g.id === gastoEditandoId ? {
            ...g,
            monto: val,
            categoriaId: cat.id,
            categoria: cat.label,
            icono: cat.icon
          } : g));
          setGastoEditandoId(null);
        } else {
          const ahora = new Date();
          setGastos(prev => [{
            id: Date.now(),
            timestamp: ahora.getTime(),
            monto: val,
            categoriaId: cat.id,
            categoria: cat.label,
            icono: cat.icon,
            hora: ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            fecha: ahora.toLocaleDateString('es-SV')
          }, ...prev]);
        }
        setMontoGasto('');
      };

      const iniciarEdicionGasto = (g) => {
        setGastoEditandoId(g.id);
        setMontoGasto(g.monto.toString());
        setCatGasto(g.categoriaId || GASTOS_CATEGORIAS[0].id);
      };

      const cancelarEdicionGasto = () => {
        setGastoEditandoId(null);
        setMontoGasto('');
      };

      const eliminarGasto = (idGasto) => {
        if (!window.confirm('¿Eliminar este gasto registrado?')) return;
        setGastos(prev => prev.filter(g => g.id !== idGasto));
        if (gastoEditandoId === idGasto) cancelarEdicionGasto();
      };

      // Filtros de resumen
      const filtrarPorPeriodo = (lista) => {
        const ahora = new Date();
        const inicioHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).getTime();
        const hace7Dias = inicioHoy - (6 * 24 * 60 * 60 * 1000);
        const inicioMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).getTime();

        return lista.filter(item => {
          const ts = item.timestamp || item.id;
          if (periodoResumen === 'hoy') return ts >= inicioHoy;
          if (periodoResumen === 'semana') return ts >= hace7Dias;
          if (periodoResumen === 'mes') return ts >= inicioMes;
          return true;
        });
      };

      const ventasFiltradas = filtrarPorPeriodo(transacciones);
      const gastosFiltrados = filtrarPorPeriodo(gastos);

      // Conteo de órdenes por canal en el período seleccionado (excluye abonos de fiados viejos para contar pedidos reales)
      const ordenesPeriodo = ventasFiltradas.filter(t => t.tipoServicio !== 'abono_fiado');
      const totalOrdenesCount = ordenesPeriodo.length;
      const ordenesMesaCount = ordenesPeriodo.filter(t => t.tipoServicio === 'mesa' || (!t.tipoServicio && t.destino?.startsWith('Mesa')) || (!t.tipoServicio && t.destino === 'Barra')).length;
      const ordenesLlevarCount = ordenesPeriodo.filter(t => t.tipoServicio === 'llevar' || (!t.tipoServicio && t.destino?.startsWith('Llevar'))).length;
      const ordenesDeliveryCount = ordenesPeriodo.filter(t => t.tipoServicio === 'delivery' || (!t.tipoServicio && t.destino?.startsWith('Delivery'))).length;
      const ticketPromedio = totalOrdenesCount > 0 ? (ventasFiltradas.reduce((a, b) => a + b.monto, 0) / totalOrdenesCount) : 0;

      const sumVentas = ventasFiltradas.reduce((a, b) => a + b.monto, 0);
      const sumGastos = gastosFiltrados.reduce((a, b) => a + b.monto, 0);
      const gananciaNeta = sumVentas - sumGastos;

      const sumEfectivo = ventasFiltradas.filter(t => t.metodo === 'efectivo').reduce((a, b) => a + b.monto, 0);
      const sumWompi = ventasFiltradas.filter(t => t.metodo === 'wompi').reduce((a, b) => a + b.monto, 0);
      const sumTransf = ventasFiltradas.filter(t => t.metodo === 'transferencia').reduce((a, b) => a + b.monto, 0);

      const efectivoFisicoTotal = (periodoResumen === 'hoy' ? (config.fondoInicial || 0) : 0) + sumEfectivo - sumGastos;

      const desgloseGastos = GASTOS_CATEGORIAS.map(cat => {
        const totalCat = gastosFiltrados.filter(g => g.categoriaId === cat.id).reduce((a, b) => a + b.monto, 0);
        const porcentaje = sumGastos > 0 ? Math.round((totalCat / sumGastos) * 100) : 0;
        return { ...cat, total: totalCat, porcentaje };
      }).filter(c => c.total > 0).sort((a, b) => b.total - a.total);

      const totalFiadosCalle = clientes.reduce((a, b) => a + (b.saldoFiado || 0), 0);
      const progresoMeta = config.metaDiaria > 0 ? Math.min(100, Math.round((sumVentas / config.metaDiaria) * 100)) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-24">
          
          {/* HEADER LIQUID GLASS */}
          <header className="liquid-glass rounded-3xl p-3.5 mb-3 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              {config.logo ? (
                <img src={config.logo} alt="Logo" className="w-10 h-10 rounded-2xl object-cover border border-white shrink-0" />
              ) : (
                <div className="w-10 h-10 rounded-2xl bg-neutral-900 text-white flex items-center justify-center font-black text-base shrink-0">
                  🫓
                </div>
              )}
              <div className="truncate">
                <h1 className="font-black text-sm text-neutral-900 leading-tight truncate">{config.negocio}</h1>
                <p className="text-[10px] font-semibold text-neutral-500 truncate">
                  {vista === 'pos' ? (
                    ordenEditando ? `Editando Orden ${formatearNumeroOrden(ordenEditando.numero)}` :
                    `Orden ${formatearNumeroOrden(contadorOrden)} • ${
                      tipoServicio === 'mesa' ? 'Comer aquí' :
                      tipoServicio === 'llevar' ? (nombreCliente ? nombreCliente : 'Para llevar') :
                      (nombreCliente ? nombreCliente : 'Delivery')
                    }`
                  ) : config.horario}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5 shrink-0">
              {vista === 'pos' && (
                <button
                  onClick={() => setModalServicio(true)}
                  className="liquid-glass-dark text-white px-3 py-1.5 rounded-full text-xs font-bold active:scale-95 transition whitespace-nowrap"
                >
                  {etiquetaServicioCorto()} ▾
                </button>
              )}
              <button
                onClick={abrirConfiguracion}
                className="w-8 h-8 rounded-full liquid-pill flex items-center justify-center text-sm active:scale-90 transition shrink-0"
              >
                ⚙️
              </button>
            </div>
          </header>

          {/* BANNER DE EDICIÓN DE ORDEN ACTIVA */}
          {vista === 'pos' && ordenEditando && (
            <div className="mb-2.5 px-3.5 py-2.5 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-between text-xs">
              <div>
                <span className="font-black text-amber-950 block">
                  ✏️ Editando Orden {formatearNumeroOrden(ordenEditando.numero)} ({ordenEditando.destino})
                </span>
                <span className="text-[10px] text-amber-900">Modifica las cantidades y guarda los cambios</span>
              </div>
              <button
                onClick={cancelarEdicionOrdenActiva}
                className="px-2.5 py-1 bg-white/85 rounded-xl font-bold text-neutral-800 text-[11px]"
              >
                Cancelar
              </button>
            </div>
          )}

          {/* VISTA 1: TOMAR ORDEN (POS) */}
          {vista === 'pos' && (
            <div className="flex-1 flex flex-col">
              <div className="grid grid-cols-1 gap-2.5 overflow-y-auto max-h-[calc(100vh-260px)] pr-0.5">
                {menuActivo.map(prod => {
                  const cantMaiz = ordenActual[`${prod.id}|maiz`] || 0;
                  const cantArroz = ordenActual[`${prod.id}|arroz`] || 0;
                  const cantSimple = ordenActual[`${prod.id}|simple`] || 0;

                  return (
                    <div key={prod.id} className="liquid-glass p-3.5 rounded-3xl flex flex-col gap-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="text-2xl">{prod.emoji}</span>
                          <span className="font-bold text-sm text-neutral-900">{prod.nombre}</span>
                        </div>
                        {!prod.esPupusa && (
                          <span className="font-mono text-xs font-bold text-neutral-500">${prod.precio.toFixed(2)}</span>
                        )}
                      </div>

                      {prod.esPupusa ? (
                        <div className="grid grid-cols-2 gap-2 pt-1 border-t border-white/60">
                          <div className={`p-2 rounded-2xl flex items-center justify-between transition ${cantMaiz > 0 ? 'bg-amber-400/25 border border-amber-400/50' : 'bg-white/50'}`}>
                            <div>
                              <p className="text-[10px] font-bold text-neutral-600 uppercase">Maíz</p>
                              <p className="font-mono text-xs font-black text-neutral-900">${prod.precioMaiz.toFixed(2)}</p>
                            </div>
                            <div className="flex items-center gap-1.5 bg-white/90 px-1.5 py-1 rounded-xl shadow-2xs">
                              <button onClick={() => ajustarCantidad(`${prod.id}|maiz`, -1)} className="w-6 h-6 flex items-center justify-center font-bold text-neutral-500">-</button>
                              <span className="font-mono font-bold text-xs w-4 text-center">{cantMaiz}</span>
                              <button onClick={() => ajustarCantidad(`${prod.id}|maiz`, 1)} className="w-6 h-6 flex items-center justify-center font-bold text-neutral-900">+</button>
                            </div>
                          </div>

                          <div className={`p-2 rounded-2xl flex items-center justify-between transition ${cantArroz > 0 ? 'bg-emerald-400/25 border border-emerald-400/50' : 'bg-white/50'}`}>
                            <div>
                              <p className="text-[10px] font-bold text-neutral-600 uppercase">Arroz</p>
                              <p className="font-mono text-xs font-black text-neutral-900">${prod.precioArroz.toFixed(2)}</p>
                            </div>

                  <div className="space-y-2.5">
                    {clientes.length > 0 && (
                      <div className="flex gap-1.5 overflow-x-auto pb-1">
                        {clientes.map(c => (
                          <button
                            key={c.id}
                            onClick={() => { setNombreCliente(c.nombre); setTelefonoCliente(c.telefono || ''); setDireccionCliente(c.direccion || ''); }}
                            className="px-2.5 py-1 rounded-full text-xs bg-neutral-100 font-semibold whitespace-nowrap"
                          >
                            {c.nombre}
                          </button>
                        ))}
                      </div>
                    )}
                    <input type="text" placeholder="Nombre del Cliente" value={nombreCliente} onChange={e => setNombreCliente(e.target.value)} className="w-full bg-neutral-100 rounded-2xl p-3 text-xs font-semibold focus:outline-none" />
                    <input type="tel" placeholder="Teléfono (Opcional)" value={telefonoCliente} onChange={e => setTelefonoCliente(e.target.value)} className="w-full bg-neutral-100 rounded-2xl p-3 text-xs font-semibold focus:outline-none" />
                    {tipoServicio === 'delivery' && (
                      <input type="text" placeholder="Dirección de entrega" value={direccionCliente} onChange={e => setDireccionCliente(e.target.value)} className="w-full bg-neutral-100 rounded-2xl p-3 text-xs font-semibold focus:outline-none" />
                    )}
                    <button onClick={() => setModalServicio(false)} className="w-full py-3 liquid-glass-dark text-white rounded-2xl font-bold text-xs">Confirmar</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL 2: CONFIRMAR COMANDA CON RESUMEN DESGLOSADO */}
          {modalComanda && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm flex items-end justify-center p-3 z-40">
              <div className="liquid-glass-solid rounded-4xl p-5 w-full max-w-sm shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <div>
                    <p className="text-[10px] font-bold uppercase text-neutral-400">
                      Orden {formatearNumeroOrden(contadorOrden)} • {tipoServicio === 'mesa' ? (mesaSeleccionada === 'barra' ? 'Barra' : `Mesa #${mesaSeleccionada}`) :
                       tipoServicio === 'llevar' ? `Llevar: ${nombreCliente || 'Mostrador'}` :
                       `Delivery: ${nombreCliente || 'Cliente'}`}
                    </p>
                    <h3 className="font-black text-base text-neutral-900">Revisar y Confirmar Pedido</h3>
                  </div>
                  <button onClick={() => setModalComanda(false)} className="w-7 h-7 rounded-full bg-neutral-100 flex items-center justify-center font-bold text-xs text-neutral-600">✕</button>
                </div>

                <div className="bg-neutral-50 border border-neutral-200/80 rounded-2xl p-3 max-h-40 overflow-y-auto divide-y divide-neutral-200/60">
                  {Object.entries(ordenActual).map(([key, cant]) => {
                    const [prodId, masa] = key.split('|');
                    const prod = menuActivo.find(m => m.id === prodId);
                    if (!prod) return null;
                    const precioUnit = prod.esPupusa ? (masa === 'arroz' ? prod.precioArroz : prod.precioMaiz) : prod.precio;
                    return (
                      <div key={key} className="py-1.5 first:pt-0 last:pb-0 flex items-center justify-between text-xs">
                        <div className="pr-2">
                          <p className="font-bold text-neutral-900">
                            {prod.emoji} {prod.nombre}{' '}
                            {prod.esPupusa && (
                              <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold ${masa === 'arroz' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                {masa === 'arroz' ? 'Arroz' : 'Maíz'}
                              </span>
                            )}
                          </p>
                          <p className="text-[10px] font-mono text-neutral-500">
                            {cant} × ${precioUnit.toFixed(2)} = <b className="text-neutral-800">${(cant * precioUnit).toFixed(2)}</b>
                          </p>
                        </div>

                        <div className="flex items-center gap-1.5 bg-white px-1.5 py-0.5 rounded-xl border border-neutral-200 shrink-0">
                          <button onClick={() => ajustarCantidad(key, -1)} className="w-5 h-5 flex items-center justify-center font-bold text-neutral-500">-</button>
                          <span className="font-mono font-bold text-xs w-4 text-center">{cant}</span>
                          <button onClick={() => ajustarCantidad(key, 1)} className="w-5 h-5 flex items-center justify-center font-bold text-neutral-900">+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="flex justify-between items-center px-1">
                  <span className="text-xs font-bold text-neutral-500">Total ({itemsTotalCount} productos):</span>
                  <span className="font-mono text-2xl font-black text-neutral-900">${totalOrden.toFixed(2)}</span>
                </div>

                <div className="grid grid-cols-2 gap-1.5 p-1 bg-neutral-100 rounded-2xl text-xs font-bold">
                  <button onClick={() => setEstadoPagoInicial('pendiente')} className={`py-2 rounded-xl transition ${estadoPagoInicial === 'pendiente' ? 'liquid-glass-dark text-white' : 'text-neutral-600'}`}>
                    ⏳ Paga al entregar
                  </button>
                  <button onClick={() => setEstadoPagoInicial('pagado')} className={`py-2 rounded-xl transition ${estadoPagoInicial === 'pagado' ? 'bg-emerald-600 text-white' : 'text-neutral-600'}`}>
                    ✓ Paga por adelantado
                  </button>
                </div>

                {estadoPagoInicial === 'pagado' && (
                  <div className="space-y-2 bg-neutral-50 p-3 rounded-2xl border border-neutral-200/80">
                    <div className="grid grid-cols-2 gap-1.5 text-xs font-bold">
                      <button onClick={() => setMetodoPago('efectivo')} className={`py-2 px-2.5 rounded-xl text-left border ${metodoPago === 'efectivo' ? 'liquid-glass-dark text-white border-transparent' : 'bg-white border-neutral-200'}`}>💵 Efectivo</button>
                      <button onClick={() => setMetodoPago('wompi')} className={`py-2 px-2.5 rounded-xl text-left border ${metodoPago === 'wompi' ? 'bg-purple-800 text-white border-transparent' : 'bg-white border-neutral-200'}`}>💳 Wompi</button>
                      <button onClick={() => setMetodoPago('transferencia')} className={`py-2 px-2.5 rounded-xl text-left border ${metodoPago === 'transferencia' ? 'bg-blue-700 text-white border-transparent' : 'bg-white border-neutral-200'}`}>📱 Transferencia</button>
                      <button onClick={() => setMetodoPago('fiado')} className={`py-2 px-2.5 rounded-xl text-left border ${metodoPago === 'fiado' ? 'bg-amber-600 text-white border-transparent' : 'bg-white border-neutral-200'}`}>🤝 Queda Fiado</button>
                    </div>

                    {metodoPago === 'transferencia' && (
                      <button
                        type="button"
                        onClick={() => setModalVerQr(true)}
                        className="w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-sm active:scale-95 transition"
                      >
                        📲 Mostrar QR / Cuenta de {config.bancoNombre}
                      </button>
                    )}

                    {metodoPago === 'fiado' && !nombreCliente.trim() && (
                      <input type="text" placeholder="Nombre del cliente para anotar fiado *" value={nombreCliente} onChange={e => setNombreCliente(e.target.value)} className="w-full bg-white border border-neutral-200 rounded-xl p-2 text-xs font-semibold" />
                    )}
                  </div>
                )}

                <button onClick={() => setModalDividir(true)} className="w-full py-2 bg-neutral-100 rounded-xl text-xs font-bold text-neutral-700">
                  ➗ Dividir cuenta entre amigos
                </button>

                <button onClick={crearOrdenActiva} className="w-full py-4 liquid-glass-dark text-white rounded-3xl font-black text-sm shadow-lg">
                  Enviar a Comal (Orden {formatearNumeroOrden(contadorOrden)})
                </button>
              </div>
            </div>
          )}

          {/* MODAL 3: COBRAR ORDEN ACTIVA PENDIENTE */}
          {modalCobrarActiva && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm flex items-end justify-center p-3 z-40">
              <div className="liquid-glass-solid rounded-4xl p-5 w-full max-w-sm shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <div>
                    <p className="text-[10px] font-bold uppercase text-neutral-500">
                      Orden {formatearNumeroOrden(modalCobrarActiva.numero)} • {modalCobrarActiva.montoPagado > 0 ? 'Cobrar Saldo Extra' : 'Cobrar Orden'}
                    </p>
                    <h3 className="font-black text-base text-neutral-900">
                      {modalCobrarActiva.destino} • ${(modalCobrarActiva.saldoPendiente > 0 ? modalCobrarActiva.saldoPendiente : modalCobrarActiva.monto).toFixed(2)}
                    </h3>
                  </div>
                  <button onClick={() => setModalCobrarActiva(null)} className="w-7 h-7 rounded-full bg-neutral-100 flex items-center justify-center font-bold text-xs text-neutral-600">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                  <button onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'efectivo')} className="p-3 rounded-2xl bg-neutral-100 text-neutral-900 text-left">💵 Efectivo</button>
                  <button onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'wompi')} className="p-3 rounded-2xl bg-purple-100 text-purple-900 text-left">💳 Wompi / POS</button>
                  <button onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'transferencia')} className="p-3 rounded-2xl bg-blue-100 text-blue-900 text-left">📱 Transferencia</button>
                  <button onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'fiado')} className="p-3 rounded-2xl bg-amber-100 text-amber-900 text-left">🤝 Queda Fiado</button>
                </div>

                <button
                  type="button"
                  onClick={() => setModalVerQr(true)}
                  className="w-full py-3 bg-blue-600 text-white rounded-2xl text-xs font-bold shadow-sm active:scale-95 transition"
                >
                  📲 Ver QR / Cuenta ({config.bancoNombre})
                </button>
              </div>
            </div>
          )}

          {/* MODAL 4: MOSTRAR QR BANCARIO */}
          {modalVerQr && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-[999]">
              <div className="liquid-glass-solid rounded-4xl p-6 w-full max-w-xs text-center space-y-3 shadow-2xl relative">
                <button
                  onClick={() => setModalVerQr(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold text-xs text-neutral-700"
                >
                  ✕
                </button>
                <p className="text-xs font-black uppercase tracking-wider text-blue-700 pt-1">{config.bancoNombre}</p>
                <h3 className="font-black text-base text-neutral-900">{config.negocio}</h3>
                
                {config.bancoCuenta && (
                  <div className="bg-blue-50 border border-blue-200 py-2 px-3 rounded-2xl">
                    <span className="text-[10px] uppercase font-bold text-blue-700 block">Número de Cuenta</span>
                    <span className="font-mono text-sm font-black text-neutral-900 select-all">{config.bancoCuenta}</span>
                  </div>
                )}

                {config.bancoQr ? (
                  <div className="bg-white p-3 rounded-3xl border border-neutral-200 shadow-inner">
                    <img src={config.bancoQr} alt="QR Banco" className="w-52 h-52 mx-auto rounded-xl object-contain" />
                  </div>
                ) : (
                  <div className="p-5 bg-neutral-100 rounded-2xl text-xs text-neutral-600">
                    No has subido una captura de QR aún. Puedes agregarla en el botón ⚙️ de arriba.
                  </div>
                )}

                <button
                  onClick={() => setModalVerQr(false)}
                  className="w-full py-3.5 liquid-glass-dark text-white rounded-2xl font-bold text-xs"
                >
                  Listo, volver a la orden
                </button>
              </div>
            </div>
          )}

          {/* MODAL 5: DIVIDIR CUENTA */}
          {modalDividir && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-[999]">
              <div className="liquid-glass-solid rounded-4xl p-5 w-full max-w-xs text-center space-y-3 shadow-2xl">
                <h4 className="font-bold text-sm">Dividir Total: ${totalOrden.toFixed(2)}</h4>
                <div className="flex items-center justify-center gap-4 my-2">
                  <button onClick={() => setPersonasDividir(Math.max(2, personasDividir - 1))} className="w-10 h-10 rounded-2xl bg-neutral-100 font-bold text-lg">-</button>
                  <div>
                    <p className="text-3xl font-black font-mono">{personasDividir}</p>
                    <p className="text-[10px] font-bold uppercase text-neutral-500">Personas</p>
                  </div>
                  <button onClick={() => setPersonasDividir(personasDividir + 1)} className="w-10 h-10 rounded-2xl bg-neutral-100 font-bold text-lg">+</button>
                </div>
                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl">
                  <p className="text-[11px] text-emerald-800">Cada uno paga:</p>
                  <p className="text-2xl font-black font-mono text-emerald-700">${(totalOrden / personasDividir).toFixed(2)}</p>
                </div>
                <button onClick={() => setModalDividir(false)} className="w-full py-3 liquid-glass-dark text-white rounded-2xl font-bold text-xs">Listo</button>
              </div>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN INFERIOR LIQUID GLASS */}
          <nav className="fixed bottom-3 left-3 right-3 max-w-md mx-auto liquid-glass rounded-3xl p-2 flex justify-around text-xs z-30">
            <button onClick={() => setVista('pos')} className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition ${vista === 'pos' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">🫓</span>
              <span className="text-[10px]">Ordenar</span>
            </button>
            <button onClick={() => setVista('activas')} className={`relative flex flex-col items-center py-1 px-2.5 rounded-2xl transition ${vista === 'activas' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              {ordenesActivas.length > 0 && (
                <span className="absolute -top-1 right-1 bg-rose-500 text-white text-[9px] font-black px-1.5 rounded-full">
                  {ordenesActivas.length}
                </span>
              )}
              <span className="text-base">🔥</span>
              <span className="text-[10px]">Activas</span>
            </button>
            <button onClick={() => setVista('gastos')} className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition ${vista === 'gastos' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">🧾</span>
              <span className="text-[10px]">Gastos</span>
            </button>
            <button onClick={() => setVista('clientes')} className={`relative flex flex-col items-center py-1 px-2.5 rounded-2xl transition ${vista === 'clientes' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              {totalFiadosCalle > 0 && <span className="absolute top-1 right-2 w-2 h-2 rounded-full bg-amber-500" />}
              <span className="text-base">👥</span>
              <span className="text-[10px]">Clientes</span>
            </button>
            <button onClick={() => setVista('resumen')} className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition ${vista === 'resumen' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">📊</span>
              <span className="text-[10px]">Resumen</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
